<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MZ IPTV Player</title>
<!-- Tab + home-screen icons: generated from art/icon.jpg by art/make-icons.py -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Decide the host before first paint. Inside the Android TV app the native
  // layer injects `MZNative` and draws the video UNDER this (transparent) page.
  document.documentElement.className = window.MZNative ? "is-native" : "is-web";
</script>

<!-- Inter Variable 5.1.0 (weights 100–900 in one file), bundled in vendor/
     — the page loads nothing from CDNs; only playlists, streams and logos
     come from the network. -->
<style>
@font-face {
  font-family: 'Inter Variable';
  font-style: normal;
  font-display: swap;
  font-weight: 100 900;
  src: url(vendor/inter-latin-wght-normal.woff2) format('woff2-variations');
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
</style>

<style>
  /* =====================================================================
     DESIGN TOKENS — shadcn zinc dark palette + blue primary (from the app icon).
     Plain hex / rgba (exact conversions of the OKLCH design values): oklch()
     needs WebView 111+, and many TV boxes ship far older WebViews
       --background / --foreground        base page surface + text
       --card / --muted                   raised / de-emphasised surfaces
       --muted-foreground                 secondary text (zinc-400: ≥7:1)
       --border / --input                 outlines, form fields
       --primary / --primary-foreground   blue accent (focus, buttons). WCAG 2.2 contrast:
                                          8.0:1 on --background, 7.1:1 on --card,
                                          6.0:1 on --muted (focused rows, keys);
                                          dark text on a blue button 8.0:1
       --ring                             focus ring glow
     TV (10-foot UI) tokens:
       --safe-x / --safe-y   overscan-safe margin (Android TV: ~5%)
       --strip-w             channel strip + filter panel width
       --row-h               channel row height — JS writes the exact px
                             value it uses for list virtualization
     Sizing: everything is in rem. The root font follows the screen's
     SHORT side (height, or width×9/16 when portrait), so a 1080p TV
     (960×540 CSS px in the WebView) gets 18px and a phone gets 15px.
     Layouts: landscape = side strip over fullscreen video (TV, desktop,
     phone sideways); portrait = video on top, channel list below.
  ===================================================================== */
  :root {
    --background:        #09090b;   /* zinc-950 */
    --foreground:        #f9fafb;   /* zinc-50  */
    --card:              #18181b;   /* zinc-900 */
    --muted:             #27272a;   /* zinc-800 */
    --muted-foreground:  #9f9fa9;   /* zinc-400 */
    --border:            #3f3f46;   /* zinc-700 — zinc-800 vanishes on TV panels */
    --input:             #18181b;
    --ring:              rgba(107, 165, 251, 0.3);
    --primary:           #6ba5fb;        /* icon blue, lightened for dark UI */
    --primary-line:      rgba(107, 165, 251, 0.45); /* quality badge outline */
    --primary-halo:      rgba(107, 165, 251, 0.15); /* number-entry glow */
    --primary-foreground:#09090b;
    --danger:            #ff6467;    /* red-400 */
    --panel:             rgba(9, 9, 11, 0.85);   /* list + filter over the video; ≥0.82 keeps grey text ≥4.5:1 even on a white frame */

    --radius:            0.625rem;
    --radius-sm:         calc(var(--radius) * 0.6);
    --radius-md:         calc(var(--radius) * 0.8);
    --radius-lg:         var(--radius);
    --radius-xl:         calc(var(--radius) * 1.4);
    --radius-2xl:        calc(var(--radius) * 2.2);

    --safe-x:            max(5vw, env(safe-area-inset-left), env(safe-area-inset-right));   /* + phone notch */
    --safe-y:            max(5vh, env(safe-area-inset-top), env(safe-area-inset-bottom));
    --strip-w:           calc(var(--safe-x) + min(24rem, 46vw));
    --row-h:             3.2rem;
  }

  /* ---- Reset ---- */
  *, *::before, *::after { box-sizing:border-box; }
  html { font-size: clamp(15px, calc(min(100vh, 56.25vw) / 30), 28px); }   /* 540p→18px · 720p→24px · ≥840p→28px */
  html { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%;
    background:var(--background); color:var(--foreground); overflow:hidden;
    font-family:'Inter Variable', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  body { font-size:1rem; }
  html.is-native, html.is-native body { background:transparent; }   /* ExoPlayer shows through */
  .is-native .web-only, .is-web .tv-only { display:none !important; }
  /* App: <video> stays in the layout, invisible — its box tells ExoPlayer where to draw.
     The tap layer + control bar are for touch screens only (phone / tablet app). */
  .is-native #video { visibility:hidden; }
  html.is-native:not(.touch) .pointer-ui { display:none !important; }
  [hidden] { display:none !important; }

  .ic { width:1em; height:1em; flex-shrink:0; fill:currentColor; vertical-align:-0.15em; }
  kbd {
    font-family:ui-monospace, Menlo, Consolas, monospace;
    background:var(--muted); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:0 .4em;
    font-size:.85em; color:var(--primary); font-weight:600; white-space:nowrap;
  }
  .dot { display:inline-block; width:.75em; height:.75em; border-radius:50%; margin:0 .08em; vertical-align:-0.05em; }
  .dot.red { background:#e53935; } .dot.green { background:#43a047; }
  .dot.yellow { background:#fdd835; } .dot.blue { background:#1e88e5; }

  /* ---- Fullscreen video (browser; the app draws ExoPlayer here) + the tap/swipe layer over it ---- */
  #video { position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:contain; background:#000; z-index:0; }
  #tap { position:fixed; top:0; right:0; bottom:0; left:0; z-index:1; touch-action:none; }
  .channel, .ritem, .mitem, .fitem, #controls, #tap { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  /* ---- Channel strip ---- */
  #strip {
    position:fixed; top:0; left:0; height:100%; width:var(--strip-w); z-index:10;
    background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; gap:.6rem;
    padding:var(--safe-y) .9rem var(--safe-y) var(--safe-x);
    transform:translateX(-100%); transition:transform .25s cubic-bezier(.4,0,.2,1);
  }
  #strip.open { transform:translateX(0); }

  .brand {
    display:flex; align-items:center; gap:.4rem;
    color:var(--primary); text-transform:uppercase; letter-spacing:.1em;
    font-size:.8rem; font-weight:700; white-space:nowrap;
  }
  /* The logo needs ~2em to read at this small text size; the negative margin keeps the row height. */
  .brand .logo { font-size:2em; margin:-.25em 0; }
  .head { display:flex; gap:.4rem; align-items:center; }
  #urlform { flex:1; min-width:0; display:flex; margin:0; }
  #url {
    flex:1; min-width:0;
    background:var(--input); border:2px solid var(--border); color:var(--foreground);
    padding:.35rem .6rem; border-radius:var(--radius-md); font:inherit; font-size:.85rem;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .hbtn {
    display:inline-flex; align-items:center; gap:.35rem;
    background:var(--muted); color:var(--foreground); border:2px solid var(--border);
    padding:.35rem .7rem; border-radius:var(--radius-md);
    font:inherit; font-size:.85rem; font-weight:600; white-space:nowrap; cursor:pointer;
    transition:border-color .15s, opacity .15s;
  }
  .hbtn.primary { background:var(--primary); color:var(--primary-foreground); border-color:var(--primary); font-weight:700; }
  .hbtn:hover { border-color:var(--primary); }
  .hbtn:disabled { opacity:.5; cursor:default; }
  /* Remote focus on the top bar (and keyboard focus in the URL field) */
  #url:focus, .hf { border-color:var(--primary); outline:2px solid var(--primary); outline-offset:2px; box-shadow:0 0 0 5px var(--ring); }

  .filterline { font-size:.8rem; color:var(--muted-foreground); min-height:1.2rem; }
  .filterline b { color:var(--primary); }

  /* ---- Virtualized channel list ---- */
  #list { flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; position:relative; scrollbar-width:none; }
  #list::-webkit-scrollbar { display:none; }
  #sizer { position:relative; width:100%; }

  .channel {
    position:absolute; left:0; right:0; height:var(--row-h);
    display:flex; align-items:center; gap:.7rem; padding:0 .8rem;
    border:2px solid transparent; border-radius:var(--radius-lg);
    font-size:1.05rem; font-weight:600; cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .channel .num {
    font-family:ui-monospace, Menlo, Consolas, monospace;
    color:var(--muted-foreground); font-size:.8rem; min-width:2.6rem;
    text-align:right; flex-shrink:0; font-weight:400;
  }
  .logo { width:2rem; height:2rem; object-fit:contain; background:#000; border-radius:var(--radius-sm); flex-shrink:0; }
  span.logo { visibility:hidden; }
  .channel .txt { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; line-height:1.25; }
  .channel .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  /* Quiet second line: country · quality · flags · genre */
  .channel .meta, #banner .bn2 {
    display:flex; align-items:center; gap:.35rem; min-width:0;
    font-size:.75rem; font-weight:500; color:var(--muted-foreground); white-space:nowrap; overflow:hidden;
  }
  .meta .g { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .badge {
    flex-shrink:0; padding:0 .35em; border-radius:var(--radius-sm); border:1px solid var(--border);
    font-size:.72rem; font-weight:700; letter-spacing:.04em; line-height:1.45; color:var(--muted-foreground);
  }
  .badge.cc { background:var(--border); border-color:transparent; color:var(--foreground); font-family:ui-monospace, Menlo, Consolas, monospace; }
  .badge.q { color:var(--primary); border-color:var(--primary-line); }
  .badge.warn { color:var(--danger); border-color:rgba(255, 100, 103, 0.45); }
  .channel .favic { display:none; color:var(--primary); margin-right:.3em; }
  .channel.fav .favic { display:inline-block; }
  /* Playing indicator sits outside the name so truncation never hides it */
  .channel .playind { color:var(--primary); opacity:0; }
  .channel.playing .playind { opacity:1; }

  /* TV focus ring — the most important visual in the whole app */
  .channel.focused {
    background:var(--muted); border-color:var(--primary);
    box-shadow:0 0 0 3px var(--ring), 0 6px 24px rgba(0, 0, 0, 0.5);
  }
  .channel.focused .num, .channel.playing .num { color:var(--primary); }
  #strip.zone-head .channel.focused { border-color:transparent; box-shadow:none; background:rgba(39, 39, 42, 0.5); }

  #empty {
    position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.4rem; padding:1rem;
    text-align:center; color:var(--muted-foreground); font-size:.9rem;
  }
  #empty b { color:var(--foreground); font-size:1rem; }
  .foot { font-size:.8rem; color:var(--muted-foreground); }

  /* ---- Filter panel (covers the strip) ---- */
  #filter {
    position:fixed; top:0; left:0; height:100%; width:var(--strip-w); z-index:16;
    background:var(--panel); border-right:1px solid var(--border);
    padding:var(--safe-y) .9rem var(--safe-y) var(--safe-x);
    display:none; flex-direction:column; gap:.3rem;
  }
  #filter.open { display:flex; }
  /* The filter sits on top of the list and both are see-through: hide the list meanwhile */
  .filter-open #strip { visibility:hidden; }
  .fhead { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
  #filter h3 {
    color:var(--primary); font-size:.8rem; text-transform:uppercase;
    letter-spacing:.12em; font-weight:700; margin:0;
  }
  #fcount { color:var(--muted-foreground); font-size:.85rem; margin-bottom:.4rem; }
  #fcount b { color:var(--foreground); font-weight:600; }
  #fitems, #fpick {
    flex:1; min-height:0; overflow-y:auto; scrollbar-width:none;
    display:flex; flex-direction:column; gap:.15rem;
  }
  #fitems::-webkit-scrollbar, #fpick::-webkit-scrollbar { display:none; }

  .fitem {
    display:flex; justify-content:space-between; align-items:center; gap:.7rem;
    padding:.6rem .8rem; border-radius:var(--radius-lg); flex-shrink:0;
    border:2px solid transparent; font-size:1rem; font-weight:500; cursor:pointer;
    transition:background .1s, border-color .1s;
  }
  .fitem .val {
    color:var(--muted-foreground); font-family:ui-monospace, Menlo, Consolas, monospace;
    font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%;
  }
  .fitem .pl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fitem.cycle .val::before { content:"‹ "; color:var(--primary); }
  .fitem.cycle .val::after  { content:" ›"; color:var(--primary); }
  .fitem.search { flex-direction:column; align-items:stretch; gap:.4rem; }
  .fitem.focused, .pitem.focused {
    background:var(--muted); border-color:var(--primary); box-shadow:0 0 0 3px var(--ring);
  }
  .fitem.focused .val { color:var(--primary); }
  .pitem.current .pl::before { content:"● "; color:var(--primary); }

  #fsearch {
    width:100%; background:var(--input); border:2px solid var(--border);
    color:var(--foreground); padding:.4rem .6rem; border-radius:var(--radius-md);
    font:inherit; font-size:.95rem; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  #fsearch:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--ring); }

  /* ---- Now-playing banner ---- */
  #banner {
    position:fixed; left:var(--safe-x); bottom:var(--safe-y); z-index:12;
    max-width:calc(100vw - 2 * var(--safe-x));
    display:flex; align-items:center; gap:.7rem;
    background:rgba(24, 24, 27, 0.95);
    border:1px solid var(--border); border-radius:var(--radius-xl);
    padding:.7rem 1.1rem; font-size:1.05rem; color:var(--muted-foreground);
    opacity:0; transform:translateY(8px);
    transition:opacity .25s ease, transform .25s ease, left .25s ease;
    pointer-events:none; box-shadow:0 8px 32px rgba(0, 0, 0, 0.5);
  }
  .strip-open #banner { left:calc(var(--strip-w) + 1rem); max-width:calc(100vw - var(--strip-w) - 1rem - var(--safe-x)); }
  #banner.show { opacity:1; transform:translateY(0); }
  #banner b { color:var(--foreground); font-weight:700; }
  #banner .ic { color:var(--primary); font-size:1.2em; }
  #banner .logo { width:2.6rem; height:2.6rem; border-radius:var(--radius-md); }
  #banner .bn { display:flex; flex-direction:column; gap:.2rem; min-width:0; }
  #banner .bn1 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #banner .bn2 { font-size:.85rem; flex-wrap:wrap; white-space:normal; }

  /* ---- Player status card (tuning / buffering / paused / error) ---- */
  #status {
    position:fixed; z-index:4; top:50%; left:50%; transform:translate(-50%, -50%);
    display:none; flex-direction:column; align-items:center; gap:.5rem;
    width:max-content; max-width:min(30rem, 80vw);
    padding:1.2rem 1.6rem; text-align:center;
    background:rgba(24, 24, 27, 0.92); border:1px solid var(--border);
    border-radius:var(--radius-xl); box-shadow:0 8px 32px rgba(0, 0, 0, 0.5);
    font-size:1rem; color:var(--muted-foreground); transition:left .25s ease;
  }
  .strip-open #status { left:calc(var(--strip-w) + (100vw - var(--strip-w)) / 2); max-width:min(30rem, calc(100vw - var(--strip-w) - 2rem)); }
  #status.busy, #status.paused, #status.error { display:flex; }
  #status.busy { animation:fade-in .2s .35s both; }   /* no flicker on fast tunes */
  #status b { color:var(--foreground); font-size:1.1rem; }
  #status small { font-size:.85rem; }
  #status > .ic { width:2.2rem; height:2.2rem; color:var(--primary); }
  #status.error > .ic { color:var(--danger); }
  .spin {
    width:2.2rem; height:2.2rem; border-radius:50%;
    border:3px solid var(--muted); border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  .spin.sm { display:inline-block; width:1em; height:1em; border-width:2px; vertical-align:-0.15em; margin-right:.3em; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes fade-in { from { opacity:0; } }

  /* ---- Number-entry overlay ---- */
  #numpad {
    position:fixed; top:var(--safe-y); left:50%; transform:translateX(-50%) scale(.92); z-index:20;
    background:rgba(24, 24, 27, 0.96);
    border:2px solid var(--primary); border-radius:var(--radius-xl);
    padding:.6rem 1.4rem; font-size:2.6rem; font-weight:800; letter-spacing:.1em;
    font-family:ui-monospace, Menlo, Consolas, monospace; color:var(--primary);
    opacity:0; pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    box-shadow:0 0 0 4px var(--primary-halo);
  }
  #numpad.show { opacity:1; transform:translateX(-50%) scale(1); }

  /* ---- Clock + controls hint (top-right, auto-hide) ---- */
  #clock {
    position:fixed; right:var(--safe-x); top:var(--safe-y); z-index:6;
    font-size:1.05rem; font-weight:600; color:var(--foreground);
    font-variant-numeric:tabular-nums; letter-spacing:.02em;
    background:var(--panel); border-radius:var(--radius-md);   /* readable on any video frame */
    padding:.1rem .6rem; transition:opacity .5s ease;
  }
  #clock .day { color:var(--muted-foreground); font-weight:500; }
  #hint {
    position:fixed; right:var(--safe-x); top:calc(var(--safe-y) + 2.4rem); z-index:5;
    max-width:min(26rem, 60vw); text-align:right; line-height:1.7;
    font-size:.8rem; color:var(--muted-foreground);
    background:var(--panel); border-radius:var(--radius-md);
    padding:.3rem .6rem; transition:opacity .5s ease;
  }
  #clock, #hint { pointer-events:none; }
  body.chrome-hidden #clock, body.chrome-hidden #hint { opacity:0; }

  /* ---- Pointer controls (browser only; TV uses the remote): shown on a tap
     or mouse move, fade after a few seconds, stay while paused ---- */
  #controls {
    position:fixed; z-index:13; bottom:var(--safe-y); left:50%; transform:translateX(-50%);
    display:flex; gap:.35rem; align-items:center; padding:.35rem;
    background:rgba(24, 24, 27, 0.92); border:1px solid var(--border);
    border-radius:999px; box-shadow:0 8px 32px rgba(0, 0, 0, 0.5);
    opacity:0; pointer-events:none; transition:opacity .2s ease, left .25s ease;
  }
  .strip-open #controls { left:calc(var(--strip-w) + (100vw - var(--strip-w)) / 2); }
  .controls-on #controls { opacity:1; pointer-events:auto; }
  .controls-on #banner { bottom:calc(var(--safe-y) + 3.8rem); }
  .cbtn, .mclose {
    display:inline-flex; align-items:center; justify-content:center;
    width:2.9rem; height:2.9rem; border-radius:50%; border:0; padding:0;
    background:transparent; color:var(--foreground); font-size:1.25rem; cursor:pointer;
  }
  .cbtn:hover, .mclose:hover { background:var(--muted); }
  .cbtn.big { background:var(--primary); color:var(--primary-foreground); }
  .cbtn.big:hover { background:var(--primary); opacity:.9; }
  .mclose { width:2.5rem; height:2.5rem; font-size:1.1rem; color:var(--muted-foreground); flex-shrink:0; }
  html.is-native:not(.touch) .mclose { display:none; }

  /* Buttons inside the status card / empty list (browser only). The card
     itself lets taps and swipes through to the video; only buttons catch them. */
  #status { pointer-events:none; }
  .sbtns { display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; margin-top:.2rem; pointer-events:auto; }
  #status .sbtns .ic, #empty .ic { width:1em; height:1em; color:inherit; }

  /* ---- Modal cards: welcome, recently watched, options menu ---- */
  .modal {
    position:fixed; top:0; right:0; bottom:0; left:0; z-index:25; display:none;
    align-items:center; justify-content:center;
    background:rgba(0, 0, 0, 0.7);
  }
  .modal.open { display:flex; }
  .modal .card {
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius-2xl); box-shadow:0 24px 64px rgba(0, 0, 0, 0.65);
    max-height:calc(100vh - 2 * var(--safe-y)); display:flex; flex-direction:column;
  }
  .mhead {
    display:flex; justify-content:space-between; align-items:baseline; gap:1rem;
    padding:0 1.2rem .8rem; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .mhead h3 {
    margin:0; font-size:.8rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.1em; color:var(--primary);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .mhead span { font-size:.8rem; color:var(--muted-foreground); white-space:nowrap; }
  .mlist { overflow-y:auto; flex:1; padding:.4rem .6rem; scrollbar-width:none; }
  .mlist::-webkit-scrollbar { display:none; }

  #welcome { z-index:30; }
  #welcome .card { width:min(42rem, 92vw); padding:1.3rem 1.7rem; overflow-y:auto; position:relative; isolation:isolate; }
  /* Faint tilted logo behind the card's bottom-right corner, clipped by the card edge */
  #welcome .wmark { position:absolute; top:0; right:0; bottom:0; left:0; overflow:hidden; pointer-events:none; z-index:-1; border-radius:inherit; }
  #welcome .wmark svg {
    position:absolute; right:-3.5rem; bottom:-4rem; width:19rem; height:19rem;
    color:var(--primary); opacity:.08; transform:rotate(-14deg);
  }
  #welcome h2 { margin:0 0 .6rem; font-size:1.35rem; font-weight:800; letter-spacing:-.01em; }
  #welcome h2 span { color:var(--primary); }

  .ritem .rtime { font-size:.8rem; color:var(--muted-foreground); }
  .mitem { font-size:1rem; font-weight:500; }
  .mitem .ic { color:var(--muted-foreground); font-size:1.15em; }
  .ritem.focused, .mitem.focused {
    background:var(--muted); border-color:var(--primary); box-shadow:0 0 0 3px var(--ring);
  }
  .ritem.focused .rname, .mitem.focused .ic { color:var(--primary); }
  .rempty { padding:1.6rem 1.2rem; text-align:center; font-size:.95rem; color:var(--muted-foreground); }

  /* ---- Touch screens: bigger targets, no keyboard hints ---- */
  .touch .hbtn, .touch #url { min-height:2.9rem; }
  .touch #hint { display:none; }
  @media (max-width: 40rem) {
    .guide { grid-template-columns:auto 1fr; }
    .guide dd[style] { grid-column:auto !important; }
  }

  /* ---- Portrait (phones, tablets, tall windows): video on top at 16:9,
     channel list below, always visible ---- */
  @media (max-aspect-ratio: 1/1) {
    :root {
      --safe-x: max(.75rem, env(safe-area-inset-left));
      --safe-y: .75rem;
      --strip-w: 100vw;
      --vid-top: env(safe-area-inset-top, 0px);
      --vid-h: 56.25vw;
    }
    #video, #tap { top:var(--vid-top); bottom:auto; height:var(--vid-h); }
    #strip, #strip.open {
      top:calc(var(--vid-top) + var(--vid-h)); bottom:0; height:auto; width:100%;
      transform:none; border-right:0; border-top:1px solid var(--border);
      padding:.75rem max(.75rem, env(safe-area-inset-right)) calc(.5rem + env(safe-area-inset-bottom)) var(--safe-x);
    }
    /* Filter takes the list's place under the video — the video stays visible */
    #filter {
      top:calc(var(--vid-top) + var(--vid-h)); bottom:0; height:auto; width:100%;
      border-right:0; border-top:1px solid var(--border);
      padding:.75rem max(.75rem, env(safe-area-inset-right)) calc(.75rem + env(safe-area-inset-bottom)) var(--safe-x);
    }
    #status, .strip-open #status {
      top:calc(var(--vid-top) + var(--vid-h) / 2); left:50%;
      max-width:92vw; padding:.6rem 1rem; gap:.3rem; font-size:.85rem;
    }
    #status > .spin { width:1.6rem; height:1.6rem; }
    #status > .ic { display:none; }   /* the video area is small: text + buttons only */
    #status b { font-size:.95rem; }
    .controls-on #status { visibility:hidden; }   /* the bar has its own ◀ ▶ while it's up */
    #banner, .strip-open #banner, .controls-on #banner {
      left:.75rem; right:.75rem; bottom:calc(.75rem + env(safe-area-inset-bottom));
      max-width:none; font-size:.9rem; padding:.55rem .8rem;
    }
    #controls, .strip-open #controls { left:50%; bottom:auto; top:calc(var(--vid-top) + var(--vid-h) - 3.9rem); }
    #controls [data-act="channels"] { display:none; }
    #numpad { top:calc(var(--vid-top) + .5rem); font-size:2rem; }
    #clock, #hint { display:none; }
  }

  /* Short landscape (phone sideways): bottom is busy with the control bar and
     the status card's buttons — show the popup banner at the top instead. */
  @media (min-aspect-ratio: 1/1) and (max-height: 520px) {
    #banner, .controls-on #banner { top:var(--safe-y); bottom:auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration:0s !important; animation-delay:0s !important; }

  }

<script>
/* =======================================================================
   MZ IPTV — hybrid build. One page, two hosts:
     • Browser: plays through <video> + hls.js (loaded on demand).
     • Android TV app: the native layer injects `MZNative`; ExoPlayer draws
       the video UNDER this transparent page. Remote buttons the WebView
       can't see (Back, Menu, CH±, colour keys…) arrive via mzOnRemote(),
       player state via mzOnNative(). UI, focus, filters, store: shared.
       On a phone / tablet the app also gets the touch UI (control bar,
       swipes, buttons) — same as the browser.
   ======================================================================= */

const NATIVE = !!(window.MZNative && typeof MZNative.play === "function");
// Built-in playlist: used on first run, when the URL field is left blank,
// and as the fallback when a saved playlist can't be loaded.
// iptv-org rebuilds this file every day at 00:00 UTC.
const DEFAULT_URL = "https://iptv-org.github.io/iptv/index.m3u";
const REFRESH_MS = 6 * 60 * 60 * 1000;   // re-download the playlist when it's older than this
const HLS_JS = "vendor/hls.min.js";   // hls.js 1.5.13, bundled; loaded only when a browser needs it
const BUFFER = 6;          // extra rows rendered above/below the viewport
let ROW_H = 58;            // px — measured from the root font size in measure()
// Portrait = video on top, list below, list always visible (CSS does the layout).
const PORTRAIT = matchMedia("(max-aspect-ratio: 1/1)");
// Touch screen (browser, or the app on a phone / tablet): control bar,
// swipes, buttons and tap/hold copy instead of keys. Also switched on by
// the first real touch (touch laptops, odd browsers). Never on a TV.
let TOUCH = !(NATIVE && MZNative.isTv()) && matchMedia("(hover: none) and (pointer: coarse)").matches;
// Real buttons in the status card / empty list: browser and touch screens. TV: key hints.
const useButtons = () => !NATIVE || TOUCH;
let lastInputAt = 0;       // last key / pointer activity (background refresh waits for idle)

const $ = (id) => document.getElementById(id);
const els = {
  url:$("url"), urlform:$("urlform"), load:$("load"), file:$("file"), fileBtn:$("fileBtn"),
  openFilter:$("openFilter"), list:$("list"), sizer:$("sizer"), empty:$("empty"),
  video:$("video"), strip:$("strip"), banner:$("banner"), numpad:$("numpad"),
  filterline:$("filterline"), foot:$("foot"), status:$("status"),
  filter:$("filter"), ftitle:$("ftitle"), fitems:$("fitems"), fpick:$("fpick"), fcount:$("fcount"),
  welcome:$("welcome"), welcomeClose:$("welcomeClose"), welcomeLead:$("welcomeLead"), guide:$("guide"),
  recent:$("recent"), rlist:$("rlist"), rkeys:$("rkeys"),
  menu:$("menu"), mlist:$("mlist"), mtitle:$("mtitle"), mkeys:$("mkeys"),
  hint:$("hint"), clock:$("clock"), tap:$("tap"), controls:$("controls"),
};

let channels = [];          // master list
let view = [];              // filtered subset actually shown
let rendered = new Map();
let focusIndex = 0;         // index into VIEW
let playingUrl = null, playingCh = null, prevUrl = null;
let playState = "idle";     // "idle" | "loading" | "buffering" | "playing" | "paused" | "error"
let muted = false, loadingPlaylist = false;
let mode = "list";          // "list" | "filter" | "welcome" | "recent" | "menu"
let zone = "list";          // inside list mode: channel rows, or the top "head" bar
let headFocus = 0;

// ---- Small helpers ----
const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ESC[c]);
const ic = (name, cls) => '<svg class="ic' + (cls ? " " + cls : "") + '"><use href="#i-' + name + '"/></svg>';
const SPIN = '<span class="spin"></span>';
const SPIN_SM = '<span class="spin sm"></span>';
const KEY = NATIVE
  ? { ok:"OK", back:"BACK", up:"▲", left:"◀", right:"▶", play:"▶❚❚" }
  : { ok:"Enter", back:"Esc", up:"↑", left:"←", right:"→", play:"Space" };
const kbd = (s) => "<kbd>" + s + "</kbd>";
// List rows keep a hidden placeholder so names stay aligned; the banner
// (collapse) drops a logo that fails to load instead of leaving a gap.
function logoHtml(url, collapse) {
  return /^https?:\/\//i.test(url || "")
    ? '<img class="logo" src="' + esc(url) + '" loading="lazy" alt="" onerror="' + (collapse ? "this.remove()" : "this.style.visibility=\'hidden\'") + '">'
    : '<span class="logo"></span>';
}

// Row height follows the root font size so the list scales with the screen.
// JS is the single source of truth: it writes --row-h for the CSS.
function measure() {
  const fs = parseFloat(getComputedStyle(document.documentElement).fontSize) || 18;
  ROW_H = Math.round(fs * 3.2);
  document.documentElement.style.setProperty("--row-h", ROW_H + "px");
}

// ---- Store (remembers source, favourites, filters, history) ----
// Favourites, history and the last channel are keyed by channel KEY
// (tvg-id when the playlist has one, else the stream URL) so they survive
// the playlist changing a channel's stream link.
const STORE_KEY = "tv.iptv.store.v1", TEXT_LIMIT = 1500000;
let favorites = new Set(), lastChannelKey = null, savedSource = null, seenWelcome = false;
let recentlyWatched = [];          // [{key, url, name, logo, watchedAt}] — newest first
const RECENT_MAX = 15;
const filter = { search:"", favOnly:false, country:null, category:null };

function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (!s) return;
    favorites = new Set(s.favorites || []);
    lastChannelKey = s.lastChannelKey || s.lastChannelUrl || null;   // older builds stored a URL
    savedSource = s.source || null;
    seenWelcome = !!s.seenWelcome;
    recentlyWatched = s.recentlyWatched || [];
    if (s.filter) Object.assign(filter, s.filter);
  } catch (e) {}
}
function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      source: savedSource, lastChannelKey, favorites: [...favorites],
      filter, seenWelcome, recentlyWatched,
    }));
  } catch (e) {}
}

// ---- Strip + auto-hide ----
// Remote / keyboard / mouse: the list slides away after 8 s without input.
// Touch screens: no timer (a slow finger-scroll isn't "input" to it) — the
// list closes on picking a channel, tapping the video, or Back.
const STRIP_HIDE = 8000;
let hideTimer = null;
const isOpen = () => PORTRAIT.matches || els.strip.classList.contains("open");
const typing = () => document.activeElement === els.url || document.activeElement === fsearch;
function scheduleHide() {
  clearTimeout(hideTimer); hideTimer = null;
  if (TOUCH) return;
  hideTimer = setTimeout(() => { if (mode === "list" && zone === "list" && !typing()) hideStrip(); }, STRIP_HIDE);
}
function showStrip() { els.strip.classList.add("open"); document.body.classList.add("strip-open"); scheduleHide(); }
function hideStrip() {
  if (mode !== "list") return;
  if (document.activeElement === els.url) els.url.blur();
  setZone("list");
  if (PORTRAIT.matches) return;   // portrait: the list lives under the video, never hidden
  els.strip.classList.remove("open"); document.body.classList.remove("strip-open");
  clearTimeout(hideTimer);
}

// ---- Top bar ("head" zone): URL · Load · File (browser) · Filter ----
const headItems = () => [els.url, els.load, els.fileBtn, els.openFilter].filter((el) => el.offsetParent !== null);
function setZone(z) {
  zone = z;
  if (z === "head") headFocus = Math.min(headFocus, headItems().length - 1);
  renderHead();
}
function renderHead() {
  els.strip.classList.toggle("zone-head", zone === "head");
  headItems().forEach((el, i) => el.classList.toggle("hf", zone === "head" && i === headFocus));
}

// ---- Chrome (clock + hint) auto-hide: show on activity, fade when idle ----
const CHROME_HIDE = 5000;
let chromeTimer = null;
function showChrome() {
  document.body.classList.remove("chrome-hidden");
  clearTimeout(chromeTimer);
  chromeTimer = setTimeout(() => document.body.classList.add("chrome-hidden"), CHROME_HIDE);
}

// ---- Banner ----
let bannerTimer = null;
function showBanner(html, ms) {
  els.banner.innerHTML = html; els.banner.classList.add("show");
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => els.banner.classList.remove("show"), ms || 4000);
  showChrome();
}

// ---- Status card: tuning / buffering / paused / error (error stays up
// until something actually plays — restricted channels are expected) ----
function setStatus(kind, html) { els.status.className = kind || ""; els.status.innerHTML = kind ? html : ""; }

// ---- Parser (country from tvg-id, multi-group categories) ----
function countryFromId(tvgId) {
  if (!tvgId) return null;
  const a = tvgId.split(".")[1]; if (!a) return null;
  const cc = a.split("@")[0].toLowerCase();
  return /^[a-z]{2}$/.test(cc) ? cc.toUpperCase() : null;
}
const CC_ALIASES = { UK:"GB" };
const regionNames = (() => { try { return new Intl.DisplayNames(["en"], { type:"region" }); } catch { return null; } })();
function countryName(cc) { if (!cc) return "All"; const iso = CC_ALIASES[cc] || cc; try { return (regionNames && regionNames.of(iso)) || cc; } catch { return cc; } }
const ccNames = {};
const ccName = (cc) => ccNames[cc] || (ccNames[cc] = countryName(cc));

// iptv-org packs extra info into the name — "BBC News (720p) [Geo-blocked]".
// Pull it out into fields (shown as badges) and keep the name clean.
function parseName(raw) {

      const groups = attr(line, "group-title").split(";").map(s => s.trim()).filter(Boolean);

    if (!ingest(text, playlistLabel(url), opts)) return false;
    if (!opts.keepSource) { savedSource = { type:"url", url }; saveStore(); }
    if (!opts.refresh || !typing()) els.url.value = url;

      const ok = await loadUrl(DEFAULT_URL, { keepSource:true });
      if (ok) showBanner(ic("alert") + "Couldn't load your playlist (" + esc(msg) + ") — showing the default one", 7000);
      return ok;
    }
    if (opts.quiet) console.warn("Playlist refresh failed: " + msg);
    else showBanner(ic("alert") + "Playlist load failed: " + esc(msg), 7000);

// ---- Keep the playlist fresh: iptv-org changes daily, and TV apps can

  // Someone browsing the list (input in the last minute) or in a menu: the
  // list would move under them — try again on the next check.
  if (mode !== "list" || numBuf || (isOpen() && Date.now() - lastInputAt < 60000)) return;
  refreshing = true;

function pushRecent(ch) {

// ---------------------------------------------------------------------
// INPUT MODEL
// Keyboard keys and remote buttons both become ACTIONS, then dispatch()
// routes each action by mode. OK is handled on key-up so that holding it
// (≥ LONG_PRESS ms) can open the options menu instead.
// ---------------------------------------------------------------------

  if (k.length === 1 && k >= "0" && k <= "9") return "digit";
  switch (k) {
    case "ArrowUp": return "up";       case "ArrowDown": return "down";
    case "ArrowLeft": return "left";   case "ArrowRight": return "right";
    case "Escape": case "GoBack": case "BrowserBack": return "back";
    case "Backspace": return "erase";
    case "PageDown": case "ChannelUp": return "chPlus";
    case "PageUp": case "ChannelDown": return "chMinus";
    case "/": return "filter";
    case "ContextMenu": return "options";
    case " ": case "MediaPlayPause": return "playPause";
    case "Info": return "info";
  }

    case "f": return "fav"; case "r": return "recent";
    case "i": return "info"; case "m": return "mute";

const REMOTE = {

function dispatch(a, arg) {

    return true;

    case "menu":    return menuAction(a);

  }

      else { setFocus(focusIndex - repeatStep()); scheduleHide(); }
      break;
    case "down":    if (!isOpen()) showStrip(); else { setFocus(focusIndex + repeatStep()); scheduleHide(); } break;
    case "left":    flip(-1); break;
    case "right":   flip(+1); break;
    case "chPlus":  if (isOpen()) { setFocus(focusIndex + pageSize()); scheduleHide(); } else flip(+1); break;
    case "chMinus": if (isOpen()) { setFocus(focusIndex - pageSize()); scheduleHide(); } else flip(-1); break;
    case "ok":

      else if (!isOpen()) { if (playState === "error" && playingCh) tune(playingCh); else showStrip(); }
      else if (!view.length) { if (channels.length) clearFilters(); else setZone("head"); }
      else select();

    case "back":

      else if (isOpen() && !PORTRAIT.matches) hideStrip();

      else if (NATIVE) {

        clearTimeout(exitTimer); exitTimer = setTimeout(() => { exitArmed = false; }, 2500);
      }

    case "digit":   pushDigit(arg); break;
    case "filter":  openFilter(); break;
    case "search":  openFilter(true); break;
    case "recent":  openRecent(); break;
    case "fav":     toggleFav(favTarget()); break;
    case "info":    infoPeek(); break;
    case "mute":    toggleMute(); break;
    case "playPause": togglePause(); break;
    case "play":    if (playState === "paused") togglePause(); break;
    case "pause":   if (playState === "playing" || playState === "buffering") togglePause(); break;
    case "last":    lastChannel(); break;

    case "right": headFocus = Math.min(items.length - 1, headFocus + 1); break;
    case "up":    break;
    case "down": case "back": setZone("list"); scheduleHide(); return true;
    case "ok": case "okLong": {

      if (el === els.url) el.focus(); else if (el) el.click();

    case "up":    filterFocus = Math.max(0, filterFocus - 1); break;

// ---- Keys typed into the two text fields ----
function urlKeys(e) {

  if (document.activeElement === fsearch) { searchKeys(e); return; }

  if (e.key === "Enter") {

  controlsTimer = setTimeout(() => { if (playState !== "paused") document.body.classList.remove("controls-on"); }, 4000);
}
function hideControls() { clearTimeout(controlsTimer); document.body.classList.remove("controls-on"); }
function updateControls() {
  if (NATIVE && !TOUCH) return;
  const set = (act, icon, label) => {
    const b = els.controls.querySelector('[data-act="' + act + '"]');
    b.querySelector("use").setAttribute("href", "#i-" + icon); b.setAttribute("aria-label", label);
  };
  set("pause", playState === "paused" ? "play" : "pause", playState === "paused" ? "Play" : "Pause");
  set("mute", muted ? "mute" : "vol", muted ? "Unmute" : "Mute");
  const full = NATIVE ? appLandscape : !!document.fullscreenElement;
  set("fullscreen", full ? "shrink" : "expand", full ? "Exit fullscreen" : "Fullscreen");
}

// Fullscreen: whole page (so the list still works), turned sideways on
// phones that allow it. iPhone has no page fullscreen → its native player.
// The app is always fullscreen: the button just holds the phone sideways.
let appLandscape = false;
function toggleFullscreen() {
  if (NATIVE) { appLandscape = !appLandscape; MZNative.setLandscape(appLandscape); updateControls(); return; }
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  const root = document.documentElement;
  if (root.requestFullscreen) {
    root.requestFullscreen({ navigationUI:"hide" })
      .then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} })
      .catch(() => {});
  } else if (els.video.webkitEnterFullscreen) els.video.webkitEnterFullscreen();
}
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) { try { screen.orientation.unlock(); } catch (e) {} }
  updateControls();
});

// Tap / swipe on the video: swipe ← → changes channel; a tap shows the
// controls (or, in landscape, closes an open channel list first).
let tapStart = null;
els.tap.addEventListener("pointerdown", (e) => { tapStart = { x:e.clientX, y:e.clientY }; });
els.tap.addEventListener("pointerup", (e) => {
  if (!tapStart) return;
  const dx = e.clientX - tapStart.x, dy = e.clientY - tapStart.y;
  tapStart = null;
  if (mode !== "list") return;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { flip(dx < 0 ? +1 : -1); showControls(); return; }
  if (Math.abs(dx) > 12 || Math.abs(dy) > 12) return;
  if (!PORTRAIT.matches && els.strip.classList.contains("open")) { hideStrip(); return; }
  if (document.body.classList.contains("controls-on") && e.pointerType !== "mouse") hideControls(); else showControls();
});
els.tap.addEventListener("pointercancel", () => { tapStart = null; });

// Tap the dimmed backdrop of a modal to close it.
els.menu.addEventListener("click", (e) => { if (e.target === els.menu) closeMenu(); });
els.recent.addEventListener("click", (e) => { if (e.target === els.recent) closeRecent(); });
els.welcome.addEventListener("click", (e) => { if (e.target === els.welcome) closeWelcome(); });

// Every button with data-act (control bar, status card, empty list, ✕).
function runAct(act) {
  switch (act) {
    case "channels":     showStrip(); break;
    case "prev":         flip(-1); break;
    case "next":         flip(+1); break;
    case "pause":        togglePause(); break;
    case "mute":         toggleMute(); break;
    case "fullscreen":   toggleFullscreen(); break;
    case "options":      openMenu(playingCh || view[focusIndex] || null); break;
    case "retry":        if (playingCh) tune(playingCh); break;
    case "clearFilters": clearFilters(); break;
    case "loadDefault":  loadUrl(DEFAULT_URL); break;
    case "closeFilter":  if (picker) closePicker(); else closeFilter(); break;
    case "closeMenu":    closeMenu(); break;
    case "closeRecent":  closeRecent(); break;
  }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  e.preventDefault(); b.blur();
  runAct(b.dataset.act);
  if (b.closest("#controls")) showControls();   // keep the bar up while it's being used
});

let rafPending = false;
els.list.addEventListener("scroll", () => {
  // Scrolling (finger, wheel, keys) counts as using the list: restart its auto-hide countdown.
  lastInputAt = Date.now();
  if (mode === "list" && els.strip.classList.contains("open")) scheduleHide();
  if (!rafPending) { rafPending = true; requestAnimationFrame(() => { rafPending = false; renderWindow(); }); }
});
els.strip.addEventListener("pointerdown", () => { if (mode === "list" && els.strip.classList.contains("open")) scheduleHide(); });
window.addEventListener("resize", () => { measure(); relayoutList(); syncVideoRect(); });

// App: ExoPlayer is a native view under this page — keep it on the page's
// video box (portrait: the 16:9 area on top; landscape: the whole screen).
function syncVideoRect() {
  if (!NATIVE) return;
  if (!PORTRAIT.matches) { MZNative.setVideoRect(0, 0, -1, -1); return; }
  const r = els.video.getBoundingClientRect();
  MZNative.setVideoRect(r.left, r.top, r.width, r.height);
}

// ---- Wiring (mouse / touch / browser) ----
// A blank URL field loads the built-in default playlist.
els.urlform.addEventListener("submit", (e) => { e.preventDefault(); els.url.blur(); setZone("list"); loadUrl(els.url.value.trim() || DEFAULT_URL); });
els.load.addEventListener("click", () => { els.load.blur(); loadUrl(els.url.value.trim() || DEFAULT_URL); });
els.file.addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });
els.openFilter.addEventListener("click", () => { els.openFilter.blur(); if (mode === "filter") closeFilter(); else openFilter(); });
els.welcomeClose.addEventListener("click", closeWelcome);
["dragenter","dragover","drop"].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));
window.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

// ---- Platform copy: remote buttons on TV, keyboard keys in a browser,
// tap / hold / swipe on touch screens ----
function applyPlatformCopy() {
  if (TOUCH) {
    els.guide.innerHTML = [
      ["Tap a channel", "Play it"],                  ["Hold a channel", "Favourite & more options"],
      ["Swipe ← → on video", "Previous / next channel"], ["Tap the video", "Show controls"],
      [ic("more"), "Options: recent, filter, mute"], [ic("expand"), "Fullscreen"],
    ].map(([k, d]) => "<dt><b>" + k + "</b></dt><dd>" + d + "</dd>").join("");
    els.welcomeLead.innerHTML = "The default playlist loads by itself — just tap a channel.";
    els.foot.innerHTML = "Hold a channel for options";
    els.rkeys.innerHTML = ""; els.mkeys.innerHTML = "";
    return;
  }
  const guide = NATIVE ? [
    ["▲ ▼", "Browse channels"],             ["OK", "Play · hold for options"],
    ["◀ ▶", "Previous / next channel"],     ["CH+ CH−", "Page through the list"],
    ["MENU", "Options (or hold OK)"],        ["BACK", "Close · twice to exit"],
    ["0–9", "Jump to channel number"],      ["▶❚❚", "Pause / play"],
  ] : [
    ["↑ ↓", "Browse channels"],             ["Enter", "Play · hold for options"],
    ["← →", "Previous / next channel"],     ["PgUp PgDn", "Page through the list"],
    ["/", "Filter & search"],               ["Esc", "Close"],
    ["0–9", "Jump to channel number"],      ["Space", "Pause / play"],
    ["F · R", "Favourite · Recent"],        ["I · M", "Info · Mute"],
  ];
  // "F · R" → two keys with a plain separator (the "·" is not a key)
  els.guide.innerHTML = guide.map(([k, d]) => "<dt>" + k.split(" ").map(t => t === "·" ? "·" : kbd(t)).join(" ") + "</dt><dd>" + d + "</dd>").join("") +
    (NATIVE ? '<dt><i class="dot red"></i><i class="dot green"></i><i class="dot yellow"></i><i class="dot blue"></i></dt>' +
              '<dd style="grid-column:span 3">Favourite · Recent · Filter · Previous channel</dd>' : "");
  els.welcomeLead.innerHTML = NATIVE
    ? "Your last channel starts automatically. Press " + kbd("▲") + " in the list to reach the playlist URL bar."
    : "The default playlist loads by itself. Use the keyboard below, or the mouse: click a channel, right-click for options.";
  els.hint.innerHTML = NATIVE
    ? "Hold " + kbd("OK") + " options · " + kbd("BACK") + " close"
    : "Hold " + kbd("Enter") + " options · " + kbd("/") + " filter · " + kbd("R") + " recent · " + kbd("Esc") + " close";
  els.foot.innerHTML = "Hold " + kbd(KEY.ok) + " for options";
  els.rkeys.innerHTML = kbd(KEY.ok) + " play · " + kbd(KEY.back) + " close";
  els.mkeys.innerHTML = kbd(KEY.back) + " close";
}

// ---- Live clock (top-right): "Mon, 10:00:10 AM" ----
function tickClock() {
  const n = new Date();
  const day  = n.toLocaleDateString(undefined, { weekday:"short" });
  const time = n.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit", second:"2-digit", hour12:true });
  els.clock.innerHTML = '<span class="day">' + day + '</span>, ' + time;
}
tickClock();
setInterval(tickClock, 1000);
showChrome();   // show briefly on launch, then fade

// ---- Startup ----
measure();
setTouch(TOUCH);   // also writes the platform copy
syncVideoRect();
PORTRAIT.addEventListener("change", () => { measure(); relayoutList(); hideControls(); syncVideoRect(); });
loadStore();
buildFilterMenu();
fsearch.value = filter.search;
document.body.classList.add("strip-open");
// The app always starts with channels: the saved playlist (re-downloaded,
// so it's current), else the built-in default. Nobody has to type a URL.
if (savedSource && savedSource.type === "url") { els.url.value = savedSource.url; loadUrl(savedSource.url, { fallback:true }); }
else if (savedSource && savedSource.type === "text") { els.url.value = ""; ingest(savedSource.text, savedSource.name); }
else {
  // First run — or a big local file (browser) that can't be reopened by itself.
  els.url.value = DEFAULT_URL;
  loadUrl(DEFAULT_URL);
}
if (!seenWelcome) openWelcome();   // first-ever visit: welcome card on top
scheduleHide();
</script>
</body>
</html>
