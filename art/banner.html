<!doctype html>
<!-- TV banner (320x180 CSS px). art/make-icons.py renders it with Chrome. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../web/vendor/inter-latin-wght-normal.woff2) format('woff2-variations')}
html,body{margin:0;width:320px;height:180px;overflow:hidden}
body{background:linear-gradient(135deg,#425be4 0%,#0b64a8 55%,#1da589 100%);display:flex;align-items:center;gap:16px;padding:0 26px;box-sizing:border-box;font-family:Inter,sans-serif}
img{width:96px;height:96px;border-radius:22px;flex-shrink:0;box-shadow:0 6px 18px rgb(0 0 0 / .28),0 0 0 1px rgb(255 255 255 / .18)}
.t{color:#fff;font-weight:800;font-size:38px;letter-spacing:-.02em;line-height:1;text-shadow:0 2px 8px rgb(0 0 0 / .25)}
.s{color:rgb(255 255 255 / .85);font-weight:600;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:9px}
</style></head><body><img src="build-banner-icon.png" alt=""><div><div class="t">MZ IPTV</div><div class="s">Live TV player</div></div></body></html>
